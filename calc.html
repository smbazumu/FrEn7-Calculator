<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="calc.css">
</head>

<body>
    <main class="container">
        <input type="text" id="inputs" value="0" readonly>
        <div class="btns">
            <button class="btn" onclick="clearInput()">AC</button>
            <button class="btn" onclick="chooseOp('MOD')">MOD</button>
            <button class="btn" onclick="calcPercent()">%</button>
            <button class="btn" onclick="chooseOp('÷')">÷</button>
            <button class="btn" onclick="addNum('7')">7</button>
            <button class="btn" onclick="addNum('8')">8</button>
            <button class="btn" onclick="addNum('9')">9</button>
            <button class="btn" onclick="chooseOp('*')">*</button>
            <button class="btn" onclick="addNum('4')">4</button>
            <button class="btn" onclick="addNum('5')">5</button>
            <button class="btn" onclick="addNum('6')">6</button>
            <button class="btn" onclick="chooseOp('-')">-</button>
            <button class="btn" onclick="addNum('1')">1</button>
            <button class="btn" onclick="addNum('2')">2</button>
            <button class="btn" onclick="addNum('3')">3</button>
            <button class="btn" onclick="chooseOp('+')">+</button>
            <button class="btn" onclick="addNum('0')">0</button>
            <button class="btn" onclick="addComma()">.</button>
            <button class="btn" onclick="removeNum()">DEL</button>
            <button class="btn" onclick="result()">=</button>
        </div>
    </main>
    <script src="calc.js"></script>
</body>

</html>
